syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Rasikrr/learning_platform_courses/pkg/server/courses/grpc;courses";

package courses;

service Courses {
  rpc CreateCourse(CreateCourseRequest) returns (EmptySuccessResponse);
  rpc GetCoursesByParams(GetCoursesByParamsRequest) returns (GetCoursesByParamsResponse);
  rpc GetCourseByID(GetCourseByIDRequest) returns (GetCourseByIDResponse);
  rpc GetCoursesByIDs(GetCoursesByIDsRequest) returns (GetCoursesByIDsResponse);
  rpc GetAllCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc GetContentByTopicID(GetContentByTopicIDRequest) returns (GetContentByTopicIDResponse);
  rpc GetQuizzesByTopicID(GetQuizzesByTopicIDRequest) returns (GetQuizzesByTopicIDResponse);
  rpc GetTasksByTopicIDAndOrderNum(GetTasksByTopicIDAndOrderNumRequest) returns (GetTasksByTopicIDAndOrderNumResponse);
}

message GetCoursesByIDsRequest{
  repeated string ids = 1;
}

message GetCoursesByIDsResponse{
  repeated Course courses = 1;
}

message GetTasksByTopicIDAndOrderNumRequest{
  string topic_id = 1;
  string course_id = 2;
  int32 order = 3;
  string user_id = 4;
}

message GetTasksByTopicIDAndOrderNumResponse{
  PracticalTask task = 1;
  optional TaskSubmission submission = 2;
}




message GetQuizzesByTopicIDRequest{
  string user_id = 1;
  string course_id = 2;
  string topic_id = 3;
}

message GetQuizzesByTopicIDResponse{
  repeated Quiz quizzes = 1;
  bool passed = 2;
}

message GetContentByTopicIDRequest{
  string topic_id = 1;
  string course_id = 2;
}

message GetContentByTopicIDResponse{
  TopicContent content = 1;
}

message GetCategoriesRequest{
}

message GetCategoriesResponse{
  repeated Category categories = 1;
}

message GetCourseByIDRequest{
  string id = 1;
}

message GetCourseByIDResponse{
  Course course = 1;
}

message GetCoursesByParamsResponse{
  repeated Course courses = 1;
}


message EmptySuccessResponse {}

message CreateCourseRequest {
  string title = 1;
  optional string image_url = 2;
  string category_id = 3;
  string description = 4;
  string created_by = 5;
}

message GetCoursesByParamsRequest {
  int64 limit = 1;
  int64 offset = 2;
  repeated string category_ids = 3;
}

message Course {
  string id = 1;
  string title = 2;
  optional string image_url = 3;
  Category category = 4;
  string description = 5;
  repeated Topic topics = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Category {
  string id = 1;
  string name = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}


message Topic {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string description = 4;
  TopicContent content = 5;
  repeated Quiz quizzes = 6;
  repeated PracticalTask practical_tasks = 7;
  int32 order_number = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message TopicContent {
  string id = 1;
  string topic_id = 2;
  string content = 3;
  repeated string additional_resources = 4;
  repeated string video_urls = 5;
  repeated string image_urls = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Quiz {
  string id = 1;
  string topic_id = 2;
  string question = 3;
  repeated string options = 4;
  repeated bool correct_answers = 5;
  bool multiple_choice = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message PracticalTask {
  string id = 1;
  string topic_id = 2;
  string description = 3;
  string difficulty_level = 4;
  string starter_code = 5;
  optional string expected_output = 6;
  int32 order_number = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  bool test_cases = 10;
  string language = 11;
}

message TaskSubmission{
  string id = 1;
  string task_id = 2;
  string user_id = 3;
  string input = 4;
  bool passed = 5;
  optional string error = 6;
  google.protobuf.Timestamp created_at = 7;
}