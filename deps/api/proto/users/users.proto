syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Rasikrr/learning_platform_users/pkg/server/users/grpc;users";

package users;

service Users{
  rpc GetByEmail(GetByEmailRequest) returns (GetByEmailResponse){}
  rpc GetByID(GetByIDRequest) returns (GetByIDResponse){}
  rpc Create(CreateUserRequest) returns (EmptySuccessResponse){}
  rpc UpdateUser(UpdateUserRequest) returns (EmptySuccessResponse){}
  rpc ResetPassword(ResetPasswordRequest) returns (EmptySuccessResponse){}
  rpc Delete(DeleteUserRequest) returns (EmptySuccessResponse){}

  rpc CheckEnrollment(CheckEnrollmentRequest) returns (CheckEnrollmentResponse){}
  rpc GetUserEnrollments(GetUserEnrollmentsRequest) returns (GetUserEnrollmentsResponse){}
  rpc Enroll(EnrollRequest) returns (EmptySuccessResponse){}
}

message EnrollRequest{
  string user_id = 1;
  string course_id = 2;
}


message GetUserEnrollmentsRequest{
  string user_id = 1;
}

message GetUserEnrollmentsResponse{
  repeated Enrollment enrollments = 1;
}

message CheckEnrollmentRequest{
  string user_id = 1;
  string course_id = 2;
}

message CheckEnrollmentResponse{
  bool enrolled = 1;
}

message UpdateUserRequest{
  string user_id = 1;
  optional string name = 2;
  optional string last_name = 3;
}

message DeleteUserRequest{
  string user_id = 1;
}


message GetByIDRequest{
  string user_id = 1;
}

message GetByIDResponse{
  User user = 1;
}



message ResetPasswordRequest{
  string email = 1;
  string passwordHash = 2;
}


message EmptySuccessResponse{
}

message CreateUserRequest{
  User user = 1;
}

message User {
  string id = 1;
  optional string name = 2;
  optional string last_name = 3;
  string email = 4;
  string password = 5;
  string account_role = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp deleted_at = 9;
}

message GetByEmailRequest{
  string email = 1;
}

message GetByEmailResponse{
  User user = 1;
}

message Enrollment{
  string id = 1;
  string user_id = 2;
  optional Course course = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}


message Course {
  string id = 1;
  string title = 2;
  optional string image_url = 3;
  Category category = 4;
  string description = 5;
  repeated Topic topics = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Category {
  string id = 1;
  string name = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}


message Topic {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string description = 4;
  TopicContent content = 5;
  repeated Quiz quizzes = 6;
  repeated PracticalTask practical_tasks = 7;
  int32 order_number = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message TopicContent {
  string id = 1;
  string topic_id = 2;
  string content = 3;
  repeated string additional_resources = 4;
  repeated string video_urls = 5;
  repeated string image_urls = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Quiz {
  string id = 1;
  string topic_id = 2;
  string question = 3;
  repeated string options = 4;
  repeated bool correct_answers = 5;
  bool multiple_choice = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message PracticalTask {
  string id = 1;
  string topic_id = 2;
  string description = 3;
  string difficulty_level = 4;
  string starter_code = 5;
  optional string expected_output = 6;
  int32 order_number = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  bool test_cases = 10;
  string language = 11;
}

message TaskSubmission{
  string id = 1;
  string task_id = 2;
  string user_id = 3;
  string input = 4;
  bool passed = 5;
  optional string error = 6;
  google.protobuf.Timestamp created_at = 7;
}